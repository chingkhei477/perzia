<style>
:root{--bg:#fbf8f3;--ink:#14213d;--mut:#55607a;--card:#fff;--line:#e8e1d5;--a:#f4a259;--t:#2ec4b6;--tx:#0f766e;--r:18px;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1626;--ink:#f3efe7;--mut:#a8b2c8;--card:#16213a;--line:#26334f;--tx:#5eead4}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:clamp(1.4rem,3.5vw,2rem)}h3{font-size:1.15rem}
a{color:var(--tx)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9}.skip:focus{left:8px}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.45rem Georgia,serif;color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:.95rem}
nav a:hover,nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
#mb{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit}
@media(max-width:760px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px 14px}nav.o{display:block}nav ul{flex-direction:column}}
.hero{padding:56px 0 40px;background:radial-gradient(600px 300px at 90% 0,rgba(244,162,89,.22),transparent),radial-gradient(500px 300px at 0 100%,rgba(46,196,182,.18),transparent)}
.hero p{max-width:620px;color:var(--mut);font-size:1.1rem}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;border:2px solid var(--ink);cursor:pointer;font-size:1rem;margin:4px 8px 4px 0}
.btn.s{background:transparent;color:var(--ink)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:20px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.c .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--a);color:#14213d;font-weight:700;margin-bottom:8px}
.sec{padding:36px 0}.pg{padding:40px 0 56px;max-width:760px}
.pg h2{margin-top:1.6em}.pg ul{padding-left:1.2em}.upd{color:var(--mut);font-size:.9rem}
.note{border-left:4px solid var(--t);background:var(--card);padding:14px 18px;border-radius:0 var(--r) var(--r) 0;margin:20px 0}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
footer{border-top:1px solid var(--line);padding:32px 0 calc(32px + env(safe-area-inset-bottom,0));color:var(--mut);font-size:.92rem}
footer .grid{margin:0 0 16px}footer a{display:block;padding:3px 0}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="w bar">
<a class="logo" href="#/" aria-label="Perzia home"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#14213d"/><path d="M22 48V16h13a10 10 0 0 1 0 20H22" fill="none" stroke="#f4a259" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="47" r="4" fill="#2ec4b6"/></svg>Perzia</a>
<button id="mb" aria-expanded="false" aria-controls="nv">Menu</button>
<nav id="nv" aria-label="Main"><ul id="nl"></ul></nav>
</div></header>
<main id="main" tabindex="-1"></main>
<footer><div class="w">
<div class="grid"><div><strong style="color:var(--ink)">Perzia</strong><br>Cashback &amp; rewards for India.<br><a href="mailto:support@perzia.in">support@perzia.in</a></div>
<div id="fl1"></div><div id="fl2"></div></div>
<p>Cashback depends on merchant confirmation and is never guaranteed. Merchant names and logos belong to their respective owners.</p>
<p>&copy; <span id="yr"></span> Perzia. All rights reserved.</p>
</div></footer>
<script>
const E='support@perzia.in';
const P={
home:{t:'Perzia – Cashback & Rewards for India',d:'Earn cashback on eligible online purchases. Clear tracking, validation and payout rules.',h:`
<section class="hero"><div class="w"><h1>Get something back for shopping you already do.</h1><p>Perzia is a cashback and rewards platform for India. When you shop through a tracked Perzia link and the merchant confirms your purchase, a share of the commission we earn is passed back to you as cashback.</p><a class="btn" href="#/deals">View deals</a><a class="btn s" href="#/how-it-works">How it works</a></div></section>
<section class="sec"><div class="w"><h2>Simple by design</h2><div class="grid">
<div class="c"><span class="n">1</span><h3>Pick an offer</h3><p>Each offer shows the merchant, the cashback rate and its terms before you click.</p></div>
<div class="c"><span class="n">2</span><h3>Shop as usual</h3><p>Go through the Perzia link and complete your purchase on the merchant's own site or app.</p></div>
<div class="c"><span class="n">3</span><h3>Cashback is validated</h3><p>The merchant confirms the order after its return period. Confirmed cashback becomes payable.</p></div></div></div></section>
<section class="sec"><div class="w"><h2>Honest by default</h2><div class="note"><p>Cashback is a share of affiliate commission, so it only exists when a merchant confirms a valid purchase. We do not promise earnings, and rates can change or be withdrawn by merchants. Read the <a href="#/cashback-terms">Cashback Terms</a> before you shop.</p></div></div></section>`},
deals:{t:'Deals – Perzia',d:'How Perzia lists cashback offers and what each listing shows.',h:`<div class="w pg"><h1>Deals</h1>
<p>Perzia lists only offers from merchants and affiliate programmes we are approved to promote. No offers are published at this moment, and we will not display a merchant or a rate until it is confirmed.</p>
<h2>What every offer shows</h2><ul><li>The merchant and the exact cashback rate or amount</li><li>Which categories, products or users are excluded</li><li>Any minimum order value, coupon or app-only conditions</li><li>Expected confirmation time and the last date the offer is valid</li></ul>
<h2>Are you a merchant or affiliate network?</h2><p>If you would like to discuss a partnership, write to <a href="mailto:${E}?subject=Partnership%20enquiry">${E}</a>.</p>
<a class="btn" href="#/cashback-terms">Read Cashback Terms</a></div>`},
'how-it-works':{t:'How It Works – Perzia',d:'Eligibility, tracking, validation and payout conditions for Perzia cashback.',h:`<div class="w pg"><h1>How Perzia works</h1>
<p>Perzia earns a commission from merchants when a customer we refer completes a valid purchase. We share part of that commission with you as cashback.</p>
<h2>1. Eligibility</h2><ul><li>You must be 18 or older and legally able to enter a contract in India.</li><li>Use accurate details and one account per person.</li><li>Only purchases made for personal use through a Perzia link qualify.</li></ul>
<h2>2. Tracking</h2><p>When you click an offer, the merchant or its affiliate network records the visit using cookies or similar tools. For tracking to work, complete the purchase in the same browser session and avoid ad-blockers, other coupon or cashback tools, and leaving to other sites mid-checkout.</p>
<h2>3. Validation</h2><p>Each order is first <strong>pending</strong>. The merchant reviews it after returns, cancellations and fraud checks, then marks it <strong>confirmed</strong> or <strong>rejected</strong>. This can take weeks, depending on the merchant.</p>
<h2>4. Payout</h2><p>Only confirmed cashback is payable. Payout methods and any minimum payout are stated with the offer or in the <a href="#/cashback-terms">Cashback Terms</a>. Cashback on cancelled, returned or refunded orders is removed.</p>
<h2>Why cashback may not track</h2><p>Missing cookies, using a different device, applying a code not issued by Perzia, excluded products, or merchant-side rejection. Contact us at <a href="mailto:${E}">${E}</a> and we will raise it with the merchant where possible.</p></div>`},
about:{t:'About Perzia',d:'About Perzia, an India-focused cashback and rewards platform.',h:`<div class="w pg"><h1>About Perzia</h1>
<p>Perzia is a cashback and rewards platform built for shoppers in India. Our aim is straightforward: show you what you may earn, explain the rules in plain language, and pay out what merchants confirm.</p>
<h2>What we stand for</h2><ul><li><strong>Clarity.</strong> Rates, exclusions and conditions are shown before you shop.</li><li><strong>Honesty.</strong> No guaranteed earnings, invented reviews or false urgency.</li><li><strong>Privacy.</strong> We collect only what we need and explain how we use it.</li></ul>
<p>Perzia is an independent service. It is not owned by, or endorsed by, the merchants it links to.</p>
<h2>Get in touch</h2><p>Email us at <a href="mailto:${E}">${E}</a>.</p></div>`},
contact:{t:'Contact – Perzia',d:'Contact Perzia support at support@perzia.in.',h:`<div class="w pg"><h1>Contact</h1>
<p>For support, cashback queries, privacy requests or partnership enquiries, email <a href="mailto:${E}">${E}</a>. You can also use the form below, which opens your email app with the message ready to send.</p>
<form id="cf"><label for="n">Your name</label><input id="n" required autocomplete="name">
<label for="e">Your email</label><input id="e" type="email" required autocomplete="email">
<label for="s">Topic</label><select id="s"><option>Cashback tracking</option><option>Payout</option><option>Privacy request</option><option>Partnership</option><option>Other</option></select>
<label for="m">Message</label><textarea id="m" rows="6" required></textarea>
<p><button class="btn" type="submit">Send by email</button></p></form>
<p class="upd">We aim to reply within a reasonable time. Never email passwords or card details.</p></div>`},
privacy:{t:'Privacy Policy – Perzia',d:'How Perzia collects, uses and protects personal data.',h:`<div class="w pg"><h1>Privacy Policy</h1><p class="upd">Last updated: October 2026</p>
<p>This policy explains how Perzia handles personal data, in line with applicable Indian law, including the Information Technology Act, 2000 and the Digital Personal Data Protection Act, 2023.</p>
<h2>Data we may collect</h2><ul><li>Details you send us, such as your name, email and message when you contact us.</li><li>Information needed to track and pay cashback, such as order references and payout details, where those features are offered.</li><li>Basic technical data like device and browser type, to keep the site secure and working.</li></ul>
<h2>How we use it</h2><p>To respond to you, track and validate cashback, process payouts, prevent fraud, meet legal duties and improve the service. We do not sell personal data.</p>
<h2>Sharing</h2><p>We may share limited data with merchants, affiliate networks, payment providers and service providers only as needed to deliver cashback, or when required by law.</p>
<h2>Retention and security</h2><p>We keep data only as long as needed for these purposes or by law, and use reasonable safeguards. No system is completely secure.</p>
<h2>Your rights</h2><p>You may ask to access, correct or erase your data, or withdraw consent, by emailing <a href="mailto:${E}">${E}</a>.</p>
<h2>Children</h2><p>Perzia is not intended for anyone under 18.</p>
<h2>Changes</h2><p>We will update this page when the policy changes and revise the date above. See also our <a href="#/cookies">Cookie Policy</a>.</p></div>`},
terms:{t:'Terms & Conditions – Perzia',d:'Terms for using the Perzia website and services.',h:`<div class="w pg"><h1>Terms &amp; Conditions</h1><p class="upd">Last updated: October 2026</p>
<p>By using Perzia you agree to these terms. If you do not agree, please do not use the service.</p>
<h2>The service</h2><p>Perzia provides information about cashback offers and, where offered, tracks and pays cashback. Purchases are made with the merchant, not Perzia, and are governed by the merchant's terms.</p>
<h2>Your responsibilities</h2><ul><li>Be 18 or older and provide accurate information.</li><li>Do not use bots, fake orders, self-referrals or any method to manipulate tracking.</li><li>Do not misuse the site or attempt to disrupt it.</li></ul>
<h2>No guarantee</h2><p>Cashback is not guaranteed. Offers may change, end or be rejected by merchants. See the <a href="#/cashback-terms">Cashback Terms</a>.</p>
<h2>Suspension</h2><p>We may withhold cashback or suspend access where we reasonably suspect fraud or breach of these terms.</p>
<h2>Liability</h2><p>To the extent permitted by law, Perzia is not liable for merchant actions, product quality, delivery or indirect losses. Nothing here limits rights you have under Indian consumer law.</p>
<h2>Governing law</h2><p>These terms are governed by the laws of India. Questions: <a href="mailto:${E}">${E}</a>.</p></div>`},
'cashback-terms':{t:'Cashback Terms – Perzia',d:'Eligibility, tracking, validation and payout conditions for Perzia cashback.',h:`<div class="w pg"><h1>Cashback Terms</h1><p class="upd">Last updated: October 2026</p>
<h2>What cashback is</h2><p>Cashback is a share of the commission Perzia receives from a merchant or affiliate network for a valid, confirmed purchase you made through a Perzia link.</p>
<h2>Eligibility</h2><ul><li>The purchase must follow a click on a Perzia offer in the same session.</li><li>It must meet the offer's conditions, including exclusions and minimum order value.</li><li>Orders paid for with gift cards, or made using other coupon or cashback sites, may be excluded where the merchant says so.</li></ul>
<h2>Statuses</h2><ul><li><strong>Pending:</strong> the order is reported but not yet verified.</li><li><strong>Confirmed:</strong> the merchant has approved it and it becomes payable.</li><li><strong>Rejected or removed:</strong> cancelled, returned, refunded, fraudulent or untracked orders.</li></ul>
<h2>Payout</h2><p>Only confirmed cashback is paid. Payout methods and any minimum amount will be stated before you request payment. Cashback is based on the amount the merchant confirms, usually excluding taxes, shipping and fees.</p>
<h2>Changes and reversals</h2><p>Rates can change without notice. Cashback paid in error, or later reversed by a merchant, may be deducted from future payouts.</p>
<h2>Queries</h2><p>Email <a href="mailto:${E}">${E}</a> with your order details and the date of purchase.</p></div>`},
refund:{t:'Refund & Cancellation Policy – Perzia',d:'How refunds and cancellations affect Perzia cashback.',h:`<div class="w pg"><h1>Refund &amp; Cancellation Policy</h1><p class="upd">Last updated: October 2026</p>
<h2>Purchases</h2><p>Perzia does not sell the products you buy and cannot refund or cancel your orders. Refunds, returns and cancellations are handled by the merchant under its own policy.</p>
<h2>Effect on cashback</h2><ul><li>If an order is cancelled, returned or refunded, the related cashback is cancelled or reversed.</li><li>For partial returns, cashback is reduced in proportion.</li><li>Cashback already paid on an order that is later returned may be recovered from future payouts.</li></ul>
<h2>Cancelling your account</h2><p>You may stop using Perzia or ask us to delete your data at any time by emailing <a href="mailto:${E}">${E}</a>. Confirmed, payable cashback remains payable subject to the Cashback Terms.</p>
<h2>Fees</h2><p>Perzia does not charge a fee for using the cashback service. If this changes, we will state it clearly beforehand.</p></div>`},
cookies:{t:'Cookie Policy – Perzia',d:'How Perzia and merchant partners use cookies.',h:`<div class="w pg"><h1>Cookie Policy</h1><p class="upd">Last updated: October 2026</p>
<h2>What cookies are</h2><p>Cookies are small files stored on your device that help sites remember information.</p>
<h2>On Perzia</h2><p>This website does not set advertising or analytics cookies. If we add any in future, we will list them here and ask for your consent where required.</p>
<h2>When you click through to a merchant</h2><p>Merchants and affiliate networks set their own cookies so that your purchase can be attributed to Perzia. These are essential for cashback tracking and are governed by their own policies.</p>
<h2>Managing cookies</h2><p>You can block or delete cookies in your browser settings, but cashback may then fail to track. Questions: <a href="mailto:${E}">${E}</a>.</p></div>`}
};
const nav=[['home','Home'],['deals','Deals'],['how-it-works','How It Works'],['about','About'],['contact','Contact']];
const legal=[['privacy','Privacy Policy'],['terms','Terms & Conditions'],['cashback-terms','Cashback Terms'],['refund','Refund & Cancellation'],['cookies','Cookie Policy']];
const L=(a,c)=>a.map(x=>`<a href="#/${x[0]==='home'?'':x[0]}">${x[1]}</a>`).join('');
document.getElementById('nl').innerHTML=nav.map(x=>`<li><a href="#/${x[0]==='home'?'':x[0]}" data-k="${x[0]}">${x[1]}</a></li>`).join('');
document.getElementById('fl1').innerHTML='<strong style="color:var(--ink)">Explore</strong>'+L(nav.slice(1));
document.getElementById('fl2').innerHTML='<strong style="color:var(--ink)">Legal</strong>'+L(legal);
document.getElementById('yr').textContent=new Date().getFullYear();
const mb=document.getElementById('mb'),nv=document.getElementById('nv');
mb.onclick=()=>{const o=nv.classList.toggle('o');mb.setAttribute('aria-expanded',o)};
function route(){
 let k=location.hash.replace(/^#\/?/,'')||'home';if(!P[k])k='home';
 const p=P[k];document.title=p.t;
 document.querySelector('meta[name=description]').content=p.d;
 document.querySelector('meta[property="og:title"]').content=p.t;
 document.querySelector('meta[property="og:description"]').content=p.d;
 document.getElementById('main').innerHTML=p.h;
 document.querySelectorAll('#nl a').forEach(a=>a.getAttribute('data-k')===k?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 nv.classList.remove('o');mb.setAttribute('aria-expanded',false);
 window.scrollTo(0,0);
 const f=document.getElementById('cf');
 if(f)f.onsubmit=e=>{e.preventDefault();
  const b=`Name: ${n.value}\nEmail: ${e2.value}\n\n${m.value}`;
  location.href=`mailto:${E}?subject=${encodeURIComponent('Perzia – '+s.value)}&body=${encodeURIComponent(b)}`};
}
const e2={get value(){return document.getElementById('e').value}};
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
